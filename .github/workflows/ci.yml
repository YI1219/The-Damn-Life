name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: sync-service (unit)
        run: pnpm --filter @the-damn-life/sync-service test
      - name: relay-go (go test)
        working-directory: services/relay-go
        run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: runtime-py (pytest)
        working-directory: services/runtime-py
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0"
          python -m pytest -q
      - name: e2e smoke (relay + runtime bridge + ws)
        env:
          # Avoid occasional proxy HTTP/2 flakiness during go module fetch.
          GIT_HTTP_VERSION: HTTP/1.1
        run: pnpm e2e
